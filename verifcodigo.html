<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaFit | Nueva contraseña</title>
 <link rel="stylesheet" href="../style/verifcodigo.css">
    

</head>

<body>

    <div class="contenedor">

        <h1>Nueva contraseña</h1>

        <p>

            Crea una contraseña segura para proteger tu cuenta de NovaFit.

        </p>

        <form action="inicio.html">

            <label>Nueva contraseña</label>

            <input
                type="password"
                placeholder="********"
                required
            >

            <label>Confirmar contraseña</label>

            <input
                type="password"
                placeholder="********"
                required
            >

            <button type="submit">

                Guardar cambios

            </button>

        </form>

        <div class="volver">

            <a href="inicio.html">
                Volver al inicio de sesión
            </a>

        </div>

    </div>

</body>

</html>

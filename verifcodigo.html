<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaFit | Nueva contraseña</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#021b12,#0b3d2e,#166534,#22c55e);
            overflow:hidden;
        }

        body::before{
            content:"";
            position:absolute;
            width:700px;
            height:700px;
            background:rgba(34,197,94,.18);
            border-radius:50%;
            filter:blur(150px);
            top:-180px;
            right:-180px;
        }

        .contenedor{

            position:relative;
            z-index:2;

            width:450px;

            padding:40px;

            border-radius:25px;

            background:rgba(255,255,255,.08);

            backdrop-filter:blur(20px);

            border:1px solid rgba(255,255,255,.15);

            color:white;

        }

        h1{

            text-align:center;

            margin-bottom:15px;

            font-size:32px;

        }

        p{

            text-align:center;

            color:#d1d5db;

            line-height:1.6;

            margin-bottom:30px;

        }

        label{

            display:block;

            margin-top:18px;

            margin-bottom:8px;

            font-size:14px;

        }

        input{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            background:rgba(255,255,255,.12);

            color:white;

            font-size:15px;

            outline:none;

        }

        input::placeholder{

            color:#d1d5db;

        }

        button{

            width:100%;

            margin-top:30px;

            padding:15px;

            border:none;

            border-radius:50px;

            background:#22c55e;

            color:white;

            font-size:17px;

            font-weight:bold;

            cursor:pointer;

            transition:.3s;

        }

        button:hover{

            background:#16a34a;

            transform:translateY(-3px);

        }

        .volver{

            text-align:center;

            margin-top:25px;

        }

        .volver a{

            color:#4ade80;

            text-decoration:none;

            font-weight:bold;

        }

    </style>

</head>

<body>

    <div class="contenedor">

        <h1>Nueva contraseña</h1>

        <p>

            Crea una contraseña segura para proteger tu cuenta de NovaFit.

        </p>

        <form action="inicio.html">

            <label>Nueva contraseña</label>

            <input
                type="password"
                placeholder="********"
                required
            >

            <label>Confirmar contraseña</label>

            <input
                type="password"
                placeholder="********"
                required
            >

            <button type="submit">

                Guardar cambios

            </button>

        </form>

        <div class="volver">

            <a href="inicio.html">
                Volver al inicio de sesión
            </a>

        </div>

    </div>

</body>

</html>

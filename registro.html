<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaFit | Crear cuenta</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#021b12,#0b3d2e,#166534,#22c55e);
            overflow:hidden;
        }

        body::before{
            content:"";
            position:absolute;
            width:700px;
            height:700px;
            background:rgba(34,197,94,.18);
            border-radius:50%;
            filter:blur(140px);
            top:-180px;
            right:-150px;
        }

        .contenedor{
            position:relative;
            z-index:2;
            width:420px;
            background:rgba(255,255,255,.08);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,.15);
            border-radius:25px;
            padding:40px;
            color:white;
        }

        h1{
            text-align:center;
            margin-bottom:10px;
            font-size:34px;
        }

        p{
            text-align:center;
            color:#d1d5db;
            margin-bottom:30px;
        }

        label{
            display:block;
            margin-top:18px;
            margin-bottom:8px;
            font-size:14px;
        }

        input{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:rgba(255,255,255,.12);
            color:white;
            font-size:15px;
            outline:none;
        }

        input::placeholder{
            color:#d1d5db;
        }

        button{
            width:100%;
            margin-top:30px;
            padding:15px;
            border:none;
            border-radius:50px;
            background:#22c55e;
            color:white;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#16a34a;
            transform:translateY(-3px);
        }

        .login{
            margin-top:25px;
            text-align:center;
            font-size:15px;
        }

        .login a{
            color:#4ade80;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <h1>NovaFit</h1>

        <p>Crea tu cuenta y comienza tu transformación.</p>

        <form>

            <label>Nombre completo</label>
            <input type="text" placeholder="Ingresa tu nombre">

            <label>Correo electrónico</label>
            <input type="email" placeholder="correo@ejemplo.com">

            <label>Contraseña</label>
            <input type="password" placeholder="********">

            <button type="submit">
                Crear cuenta
            </button>

        </form>

        <div class="login">
            ¿Ya tienes una cuenta?
            <a href="inicio.html">Inicia sesión</a>
        </div>

    </div>

</body>
</html>
